name: Cairnwork accept

# Fixture caller (E4). Runs Cairnwork's acceptance on every pull request against main and pins
# verify-action by commit; the same commit is passed as verify-action-sha. Pinned to main 325ad73
# (#29 signed verdicts, #36 J1_RUN_NOT_FOUND, #37 LEDGER_KEY_MISSING at J1, #38 key-check job).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: cairnwork-accept-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  accept:
    uses: cairnwork/verify-action/.github/workflows/accept.yml@325ad738a4aa919464ce962c94bc0b099a46bb45
    with:
      tests-repo: cairnwork/accept-fixture-tests
      ledger-repo: cairnwork/accept-fixture-ledger
      verify-action-sha: 325ad738a4aa919464ce962c94bc0b099a46bb45
      target-branch: main
      max-attempts: 3
      report-app-client-id: Iv23li91ixLc37tnCPRm
      ledger-verdict-pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGa45hq/EzbpyWlS0+APApPm8tAk089/adgXCsaA7xrs"
    secrets:
      TESTS_KEY: ${{ secrets.TESTS_KEY }}
      LEDGER_KEY: ${{ secrets.LEDGER_KEY }}
      LEDGER_VERDICT_KEY: ${{ secrets.LEDGER_VERDICT_KEY }}
      REPORT_APP_KEY: ${{ secrets.REPORT_APP_KEY }}
